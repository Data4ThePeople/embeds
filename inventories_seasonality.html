    borderWidth:hot?3.4:1.1,pointRadius:0,pointHoverRadius:hot?4:2,tension:0.2,spanGaps:true,
    order:hot?0:(1+(n-priors.indexOf(y)))};});
  document.getElementById('hiYear').textContent=HILITE;
  document.getElementById('src').textContent=
    `Source: EIA series ${p.code} — Weekly U.S. Ending Stocks, ${p.first}–present, thousand barrels. Latest year on chart: ${HILITE}. Week = (day-of-year ÷ 7), capped at 52.`;
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById('c'),{type:'line',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
    plugins:{legend:{display:false},tooltip:{callbacks:{title:(it)=>`Week ${it[0].label}`,label:(ctx)=>`${ctx.dataset.label}: ${ctx.parsed.y?ctx.parsed.y.toLocaleString(undefined,{maximumFractionDigits:0}):'—'} thousand barrels`}}},
    scales:{y:{title:{display:!isMobile,text:'Thousand barrels'},ticks:{callback:v=>v.toLocaleString()}},
    x:{title:{display:!isMobile,text:'Week of year'},ticks:{maxTicksLimit:isMobile?13:26}}}}});
}
sel.onchange=e=>draw(e.target.value);
draw(Object.keys(PRODUCTS)[0]);
</script></body></html>
